name: Download URL and Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL of file to download"
        required: true
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Setup Google Drive credentials
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.RCLONE_CONFIG }}' > ~/.config/rclone/rclone.conf

      - name: Download file
        run: |
          mkdir downloads
          cd downloads
          curl -L "${{ github.event.inputs.file_url }}" -O

      - name: Upload to Google Drive
        run: |
          rclone copy downloads remote:GithubUploads

      - name: Generate private direct download links
        shell: bash
        run: |
          touch uploaded_private_direct_links.txt

          for file in downloads/*; do
            [ -f "$file" ] || continue

            filename=$(basename "$file")

            file_id=$(rclone lsjson remote:GithubUploads/"$filename" \
              --files-only \
              --metadata | jq -r '.[0].ID')

            if [ -n "$file_id" ] && [ "$file_id" != "null" ]; then
              link="https://drive.google.com/uc?id=${file_id}&export=download"

              echo "$filename -> $link"
              echo "$filename -> $link" >> uploaded_private_direct_links.txt
            fi
          done

      - name: Output links as JSON for CLI
        run: |
          JSON="{}"
          while IFS= read -r line; do
            # lines look like: "filename.zip -> https://drive.google.com/uc?id=abc&export=download"
            if [[ "$line" =~ ^(.*)\ -\>\ (https://.*)$ ]]; then
              filename="${BASH_REMATCH[1]}"
              url="${BASH_REMATCH[2]}"
              JSON=$(jq -n --argjson prev "$JSON" --arg fn "$filename" --arg u "$url" '$prev + {($fn): $u}')
            fi
          done < uploaded_private_direct_links.txt
          echo "GDRIVE_LINKS=$JSON"
