name: Multi URL Download and Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: 'JSON array of URLs'
        required: true
        type: string
        default: '["https://example.com/file1.zip","https://example.com/file2.mp4"]'

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF

      - name: Prepare folders
        run: |
          mkdir -p downloads
          touch failed_downloads.txt

      - name: Parse URLs JSON
        run: |
          echo '${{ github.event.inputs.urls_json }}' | jq -r '.[]' > urls.txt
          echo "URLs parsed:"
          cat urls.txt

      - name: Download files
        shell: bash
        run: |
          while IFS= read -r url || [ -n "$url" ]; do
            (
              clean_url="$(echo "$url" | tr -d '\r' | xargs)"

              if [ -z "$clean_url" ]; then
                exit 0
              fi

              filename=$(basename "$(echo "$clean_url" | cut -d '?' -f1)")

              if [ -z "$filename" ] || [ "$filename" = "/" ] || [ "$filename" = "." ]; then
                filename="file_$(date +%s%N)"
              fi

              echo "Downloading: $clean_url -> $filename"

              if ! curl -L \
                --fail \
                --retry 5 \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 7200 \
                "$clean_url" \
                -o "downloads/$filename"; then

                echo "$clean_url" >> failed_downloads.txt
                rm -f "downloads/$filename"
              fi
            ) &
            
            while [ "$(jobs -r | wc -l)" -ge 16 ]; do
              sleep 1
            done

          done < urls.txt

          wait

      - name: Show results
        run: |
          echo "Downloaded files:"
          ls -lah downloads || true

          echo ""
          echo "Failed downloads:"
          cat failed_downloads.txt || true

      - name: Sync to Google Drive
        run: |
          rclone copy downloads remote:GithubUploads \
            --progress \
            --transfers=16 \
            --checkers=16 \
            --fast-list \
            --drive-chunk-size=64M \
            --stats=10s

      - name: Upload failed links log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-downloads
          path: failed_downloads.txt

      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads urls.txt failed_downloads.txt
