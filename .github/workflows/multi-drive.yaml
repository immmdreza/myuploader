name: Download Multiple URLs and Sync to Google Drive

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "Paste multiple file URLs (one per line)"
        required: true
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF

      - name: Prepare download folder
        run: mkdir -p downloads

      - name: Save URL list
        run: |
          cat << 'EOF' > urls.txt
          ${{ github.event.inputs.file_urls }}
          EOF

      - name: Download files in parallel
        shell: bash
        run: |
          mkdir -p downloads
          touch failed_downloads.txt
      
          cat urls.txt | tr -d '\r' | grep -v '^\s*$' | xargs -P 16 -n 1 -I {} bash -c '
            url="{}"
      
            filename=$(basename "$(echo "$url" | cut -d "?" -f1)")
      
            if [ -z "$filename" ] || [ "$filename" = "/" ]; then
              filename="file_$(date +%s%N)"
            fi
      
            echo "Downloading: $url -> $filename"
      
            if ! curl -L \
              --fail \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 7200 \
              "$url" \
              -o "downloads/$filename"; then
      
              echo "FAILED: $url" | tee -a failed_downloads.txt
              rm -f "downloads/$filename"
            fi
          '
      
          echo "Finished downloads"

      - name: Show failed downloads
        run: |
          if [ -s failed_downloads.txt ]; then
            echo "Some downloads failed:"
            cat failed_downloads.txt
          else
            echo "All downloads succeeded"
          fi
      
      - name: Upload failed links log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-downloads-log
          path: failed_downloads.txt

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -lah downloads

      - name: Sync files to Google Drive
        run: |
          rclone copy downloads remote:GithubUploads \
            --progress \
            --transfers=16 \
            --checkers=16 \
            --fast-list \
            --drive-chunk-size=64M \
            --stats=10s

      - name: Cleanup
        if: always()
        run: rm -rf downloads urls.txt
