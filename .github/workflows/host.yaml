name: Download and Upload to Host

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL of the file to download"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        run: |
          mkdir -p downloads
          cd downloads
          curl -L -O "${{ github.event.inputs.file_url }}"
          echo "Downloaded:"
          ls -la

      - name: Upload to host
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          for file in downloads/*; do
            [ -f "$file" ] || continue
            echo "Uploading: $(basename "$file")"
            curl -s -X POST \
              -F "file=@$file" \
              -F "token=$API_TOKEN" \
              "$UPLOAD_URL"
          done
